name: ci

on:
  push:
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        # dependency lock first: bleeding-edge pairs (scipy/sklearn) broke the
        # env once already; the lock pins the known-good combination
        run: |
          pip install -r requirements-lock.txt
          pip install -e . --no-deps
      - name: Ruff
        run: ruff check .
      - name: Pytest
        run: pytest

  site-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install jsdom
        run: npm ci
      - name: jsdom smoke over the 5 data pages
        run: npm run smoke
