name: daily-forecast

on:
  schedule:
    - cron: "17 2 * * *"  # 02:17 UTC daily
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-forecast
  cancel-in-progress: false

jobs:
  ingest-forecast-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Warm-start data caches: the ingest is incremental (tail-only), the
      # weather cache is per-point parquet — together these turn a ~90min
      # cold run into a ~15-40min daily run. Cache is saved at job end.
      - name: Restore processed + weather caches
        uses: actions/cache@v4
        with:
          path: |
            data/processed
            data/raw/weather
          key: gridcast-data-${{ github.run_id }}
          restore-keys: |
            gridcast-data-

      # NOTE: no [chronos] extras here — the daily runner ships GBM/ridge/
      # naive/ensemble only (documented in publish/forecast.py). Zero-shot
      # inference stays in the heavier weekly analysis jobs instead.
      - name: Install package
        run: pip install -e .

      - name: Ingest all markets (first try)
        run: python -m gridcast.ingest --all 2>&1 | tee ingest.log
        continue-on-error: true

      - name: Ingest retry (survives transient rate limits)
        if: failure()
        run: |
          sleep 180
          python -m gridcast.ingest --all 2>&1 | tee -a ingest.log

      - name: Forecast for all champions
        run: python -m gridcast.cli forecast 2>&1 | tee forecast.log

      - name: Healthcheck — every unit must have updated
        # per-market staleness limits live in publish/healthcheck.py (GB ~21d
        # and DK ~18d publication lags are normal, not a stall)
        run: python -m gridcast.publish.healthcheck site/data/latest_forecasts.json

      - name: Commit dashboard data back to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/data/
          if git diff --cached --quiet; then
            echo "no data changes"
          else
            git commit -m "chore(forecast): daily dashboard data update [bot]"
            git push
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        with:
          url: https://adnanadnankaldybayev-design.github.io/gridcast/
